<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>LikeMe の仕組み</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://xumm.app/assets/cdn/xumm.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body class="features-page">
  <header class="page-header">
    <a id="backHome" href="index.html" class="back-link">← HOME</a>
    <div class="wallet-info">
      <span id="connectedAddress">読込み中…</span>
    </div>
  </header>

  <div class="header-section">
    <h1>LikeMeの仕組み</h1>
    <p class="subtitle">写真を投稿して稼ぐ、投票して稼ぐ、全く新しいエコシステム</p>
  </div>

  <div class="features-grid">
    <div class="feature-card">
      <div class="icon-wrapper"><i class="fa-solid fa-camera"></i></div>
      <h3>投稿ボーナス</h3>
      <p>写真を投稿するだけで即座にトークンを獲得。</p>
    </div>
    <div class="feature-card">
      <div class="icon-wrapper"><i class="fa-solid fa-check-to-slot"></i></div>
      <h3>投票リワード</h3>
      <p>良質なコンテンツを見極めて投票し、ポイント獲得！</p>
    </div>
    <div class="feature-card">
      <div class="icon-wrapper"><i class="fa-solid fa-gem"></i></div>
      <h3>NFTマーケット</h3>
      <p>レアなアイテムをNFTとして売買可能。</p>
    </div>
  </div>

  <div style="text-align:center; margin:2rem;">
    <a href="profile.html" id="ctaProfileLink" class="btn btn-white">プロフィールへ移動</a>
    <br><br>
    <button id="logoutBtn" class="logout-btn">ログアウト</button>
  </div>
</body>
</html>
